name: uni_procurement
description: University E-Procurement & Vendor Management Web Portal
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management, DI, routing
  get: ^4.7.2

  # HTTP client
  dio: ^5.7.0

  # Local storage (web-safe, no flutter_secure_storage)
  get_storage: ^2.1.1

  # Functional error handling (Either/Failure)
  dartz: ^0.10.1

  # File picking (web-compatible)
  file_picker: ^12.2.0

  # Responsive data tables with pinned columns
  data_table_2: ^2.5.15

  # Charts for admin reports
  fl_chart: ^1.2.0

  # Typography
  google_fonts: ^8.2.1

  # Date/number formatting
  intl: ^0.20.3

  # Toast notifications
  toastification: 3.2.0

  # Dev-only request logging
  pretty_dio_logger: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dummy_database/
    - assets/images/
